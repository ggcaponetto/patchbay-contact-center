<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cc-call-button demo</title>
    <script type="module" src="/src/call-button.ts"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Any website</h1>
    <p>
      This page needs an embed key: in the desk go to
      <b>Settings → Call button for your website → Create key</b>, then open this page as
      <code>?key=pk_…</code> (or paste the key into the <code>key</code> attribute).
      <span id="key-state"></span>
    </p>
    <cc-call-button key="" queue="support" api="%VITE_API_ORIGIN%" label="Call us"></cc-call-button>
    <script>
      // `?key=pk_…&api=http://localhost:4100` overrides the attributes for quick testing.
      const params = new URLSearchParams(location.search);
      const el = document.querySelector('cc-call-button');
      for (const name of ['key', 'api', 'queue']) {
        if (params.get(name)) el.setAttribute(name, params.get(name));
      }
      document.getElementById('key-state').textContent = el.getAttribute('key')
        ? `Using key ${el.getAttribute('key')}.`
        : 'No key set yet — the button will refuse to call.';
    </script>
  </body>
</html>
