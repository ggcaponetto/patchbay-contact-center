<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>cc-call-button demo</title>
    <script type="module" src="/src/call-button.ts"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Any website</h1>
    <p>
      Paste an embed key from the supervisor settings page into the <code>key</code> attribute below
      (or append <code>?key=pk_…</code> to this URL).
    </p>
    <cc-call-button
      key=""
      queue="support"
      api="http://localhost:4000"
      label="Call us"
    ></cc-call-button>
    <script>
      // `?key=pk_…&api=http://localhost:4100` overrides the attributes for quick testing.
      const params = new URLSearchParams(location.search);
      const el = document.querySelector('cc-call-button');
      for (const name of ['key', 'api', 'queue']) {
        if (params.get(name)) el.setAttribute(name, params.get(name));
      }
    </script>
  </body>
</html>
