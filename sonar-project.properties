# SonarQube Cloud configuration - the scan runs in CI (ci.yml) once the
# SONAR_TOKEN repo secret exists.
sonar.projectKey=ggcaponetto_livekit-playground
sonar.organization=ggcaponetto
sonar.projectName=livekit-playground

sonar.sources=apps/agent/src,apps/api/src,apps/web/src,apps/embed/src,packages/shared/src
sonar.tests=apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=docs/**,**/dist/**,**/coverage/**,apps/api/drizzle/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Same contract as vitest.config.ts: wiring modules are smoke-tested, not line-covered.
sonar.coverage.exclusions=apps/api/src/testing.ts,apps/web/src/main.tsx,apps/web/src/App.tsx,apps/web/src/components/**,apps/web/src/pages/**,apps/web/src/lib/hooks.ts,apps/web/src/lib/api.ts,apps/embed/src/call-button.ts,apps/api/src/index.ts,apps/api/src/db/**,apps/api/src/livekit.ts,apps/api/src/auth.ts,apps/agent/src/**

sonar.sourceEncoding=UTF-8
