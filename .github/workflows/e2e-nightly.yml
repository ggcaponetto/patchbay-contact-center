# Nightly end-to-end run — the `core` tier plus the `cloud` tier (real agent worker against
# LiveKit Cloud) when the LIVEKIT_* secrets exist — also on demand. The README "E2E" badge
# points at this workflow. Tiers: tests/e2e/TEST-PLAN.md.
name: E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_USER=cc -e POSTGRES_PASSWORD=cc -e POSTGRES_DB=cc -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U cc && break; sleep 1; done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:all
        if: env.LIVEKIT_API_KEY != ''
      - run: npm run test:e2e
        if: env.LIVEKIT_API_KEY == ''
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-nightly
          path: |
            tests/e2e/report
            tests/e2e/results
