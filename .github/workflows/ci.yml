name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
      INTERNAL_API_SECRET: ci-secret
    steps:
      # Service containers only exist on Linux runners; the API suites need Postgres and
      # skip themselves elsewhere, so the coverage gate is enforced on Linux only.
      - name: Start Postgres
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_USER=cc -e POSTGRES_PASSWORD=cc -e POSTGRES_DB=cc -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U cc && break; sleep 1; done
      - uses: actions/checkout@v5
        with:
          # Sonar blames new code against history; a shallow clone breaks that
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting/dead-code/spelling/size gates are OS-independent; run once.
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run knip
        if: runner.os == 'Linux'
      - run: npm run spell
        if: runner.os == 'Linux'
      - run: npm run loc
        if: runner.os == 'Linux'
      - run: npm run docs:build
        if: runner.os == 'Linux'
      - run: npm run typecheck
      - run: npm test
        if: runner.os == 'Linux'
        env:
          # Agent evals need LiveKit Cloud credentials; they skip themselves when absent.
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      - run: npx vitest run --coverage.enabled=false
        if: runner.os != 'Linux'
      - run: npm run build
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # Informational like Codecov: a Sonar-side problem (e.g. Automatic Analysis still
      # enabled on sonarcloud.io) must not fail the build gate.
      - name: SonarQube scan
        if: runner.os == 'Linux' && env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Browser end-to-end tiers (tests/e2e/TEST-PLAN.md). `smoke` and `core` need only
  # Postgres — the AI is played through the internal API with dummy LiveKit credentials
  # — so they run on every push and PR. `cloud` drives the real agent worker against
  # LiveKit Cloud: on `main` only (plus the nightly E2E workflow); every step is skipped
  # without the LIVEKIT_* secrets (`secrets` cannot be used in a job-level `if`).
  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
    steps:
      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_USER=cc -e POSTGRES_PASSWORD=cc -e POSTGRES_DB=cc -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U cc && break; sleep 1; done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke
          path: |
            tests/e2e/report
            tests/e2e/results

  e2e-core:
    needs: e2e-smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
    steps:
      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_USER=cc -e POSTGRES_PASSWORD=cc -e POSTGRES_DB=cc -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U cc && break; sleep 1; done
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-core
          path: |
            tests/e2e/report
            tests/e2e/results

  e2e-cloud:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, e2e-core]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cc:cc@localhost:5432/cc
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - name: Start Postgres
        if: env.LIVEKIT_API_KEY != ''
        run: |
          docker run -d --name pg -e POSTGRES_USER=cc -e POSTGRES_PASSWORD=cc -e POSTGRES_DB=cc -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U cc && break; sleep 1; done
      - uses: actions/checkout@v5
        if: env.LIVEKIT_API_KEY != ''
      - uses: actions/setup-node@v6
        if: env.LIVEKIT_API_KEY != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.LIVEKIT_API_KEY != ''
      - run: npx playwright install --with-deps chromium
        if: env.LIVEKIT_API_KEY != ''
      - run: npm run test:e2e:cloud
        if: env.LIVEKIT_API_KEY != ''
      - uses: actions/upload-artifact@v4
        if: failure() && env.LIVEKIT_API_KEY != ''
        with:
          name: playwright-cloud
          path: |
            tests/e2e/report
            tests/e2e/results
