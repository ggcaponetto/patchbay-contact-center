# Static application security testing on the main branch: `npm run sast`
# (npm audit + Semgrep, see build/sast.mjs). Same script as on a laptop; the SARIF
# report is uploaded as a workflow artifact and to GitHub code scanning.
name: SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: reports/sast
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/sast/semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: reports/sast/semgrep.sarif
